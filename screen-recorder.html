    <!-- ===== STYLES ===== -->
    <style>
        :root {
            --bg: #0f0f1a;
            --surface: #1a1a2e;
            --surface2: #12121f;
            --border: #2a2a44;
            --text: #e0e0e0;
            --text2: #8888aa;
            --accent: #ffd200;
            --accent2: #f7971e;
            --shadow: 0 20px 60px rgba(0,0,0,0.8);
            --radius: 16px;
        }
        .light-theme {
            --bg: #f0f2f5;
            --surface: #ffffff;
            --surface2: #e8eaed;
            --border: #d0d2d6;
            --text: #1a1a2e;
            --text2: #555577;
            --accent: #2979ff;
            --accent2: #1565c0;
            --shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            transition: background 0.3s, color 0.3s, border 0.3s;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 35px;
            max-width: 920px;
            width: 100%;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .theme-toggle {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 13px;
        }
        .mode-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
            background: var(--surface2);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        .mode-btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text2);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
        }
        .mode-btn.active {
            background: var(--accent);
            color: #0f0f1a;
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(255,210,0,0.2);
        }
        .mode-btn:hover:not(.active) {
            border-color: var(--accent);
        }
        .video-wrapper {
            background: #0a0a15;
            border-radius: 16px;
            padding: 10px;
            border: 1px solid var(--border);
            position: relative;
            margin-bottom: 18px;
        }
        #preview {
            width: 100%;
            border-radius: 12px;
            height: 320px;
            object-fit: cover;
            background: #111;
            display: block;
        }
        .badge-rec {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #ff3333;
            color: #fff;
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            display: none;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { opacity:1; transform:scale(1); }
            50% { opacity:0.6; transform:scale(1.05); }
            100% { opacity:1; transform:scale(1); }
        }
        .info-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .timer {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            min-width: 90px;
        }
        .stats {
            font-size: 13px;
            color: var(--text2);
            display: flex;
            gap: 14px;
        }
        .settings-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            background: var(--surface2);
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .settings-row label {
            font-size: 13px;
            color: var(--text2);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .settings-row select, .settings-row input {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
        }
        .settings-row select:focus {
            border-color: var(--accent);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform:none !important; }
        .btn-start { background: #00c853; color: #0f0f1a; }
        .btn-start:hover:not(:disabled) { transform:scale(1.03); }
        .btn-pause { background: #ffaa00; color: #0f0f1a; }
        .btn-pause:hover:not(:disabled) { transform:scale(1.03); }
        .btn-stop { background: #ff3333; color: #fff; }
        .btn-stop:hover:not(:disabled) { transform:scale(1.03); }
        .btn-download { background: #2979ff; color: #fff; }
        .btn-download:hover:not(:disabled) { transform:scale(1.03); }
        .btn-share { background: #25d366; color: #fff; }
        .btn-share:hover:not(:disabled) { transform:scale(1.03); }
        .btn-translate { background: #8b5cf6; color: #fff; }
        .btn-summarize { background: #f59e0b; color: #0f0f1a; }
        .btn-audio { background: #ec4899; color: #fff; }
        .btn-chat { background: #10b981; color: #0f0f1a; }
        .btn-notes { background: #3b82f6; color: #fff; }
        .btn-transcribe { background: #e91e63; color: #fff; }
        .btn-youtube { background: #ff0000; color: #fff; }
        .trim-section {
            background: var(--surface2);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 14px;
            display: none;
        }
        .trim-section label {
            font-size: 13px;
            color: var(--text2);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .trim-section input[type="range"] {
            width: 100%;
            max-width: 300px;
        }
        .history {
            background: var(--surface2);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 14px;
            display: none;
        }
        .history h4 { font-size: 14px; color: var(--text2); margin-bottom: 6px; }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        .history-item button {
            background: transparent;
            border: none;
            color: var(--accent);
            cursor: pointer;
        }
        .status-msg {
            font-size: 14px;
            color: var(--text2);
            padding: 8px 14px;
            background: var(--surface2);
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            margin-top: 10px;
        }
        .footer {
            margin-top: 16px;
            font-size: 12px;
            color: var(--text2);
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        .footer a { color: var(--accent); text-decoration: none; }

        /* Chat UI */
        .chat-container {
            display: none;
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 14px;
            border: 1px solid var(--border);
            margin-top: 14px;
        }
        .chat-container.visible { display: block; }
        .chat-messages {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding-right: 6px;
        }
        .chat-message {
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 14px;
            max-width: 85%;
        }
        .chat-message.user {
            background: var(--accent);
            color: #0f0f1a;
            align-self: flex-end;
            margin-left: auto;
        }
        .chat-message.ai {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            align-self: flex-start;
        }
        .chat-input-row {
            display: flex;
            gap: 8px;
        }
        .chat-input-row input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
        }
        .chat-input-row button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #0f0f1a;
            font-weight: 600;
            cursor: pointer;
        }
        .chat-input-row button:hover { opacity: 0.9; }
        @media (max-width:600px) {
            .container { padding:18px; }
            #preview { height: 200px; }
            .controls { flex-direction: column; }
            .btn { justify-content:center; }
            .settings-row { flex-direction: column; }
            .mode-selector { flex-wrap: wrap; justify-content: center; }
        }

        /* Countdown Overlay */
        .countdown-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .countdown-overlay.visible { display: flex; }
        .countdown-number {
            font-size: 120px;
            font-weight: 900;
            color: var(--accent);
            animation: countdownPulse 1s ease-in-out infinite;
        }
        @keyframes countdownPulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .countdown-text {
            font-size: 24px;
            color: var(--text2);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="header">
        <h1>🎥 Pro Screen Recorder</h1>
        <button class="theme-toggle" id="themeToggle">🌙 Dark / Light</button>
    </div>

    <!-- Mode Selector -->
    <div class="mode-selector">
        <button class="mode-btn active" data-mode="screen">🖥️ Screen</button>
        <button class="mode-btn" data-mode="mic">🎤 Mic Only</button>
        <button class="mode-btn" data-mode="webcam">📷 Webcam</button>
        <button class="mode-btn" data-mode="pip">📺 Screen + Cam</button>
    </div>

    <div class="video-wrapper">
        <video id="preview" autoplay muted playsinline></video>
        <span class="badge-rec" id="recBadge">● REC</span>
    </div>

    <div class="info-bar">
        <div class="timer" id="timerDisplay">00:00:00</div>
        <div class="stats">
            <span id="fpsDisplay">FPS: 0</span>
            <span id="resDisplay">Res: 0x0</span>
        </div>
    </div>

    <div class="settings-row">
        <label>Quality <select id="qualitySelect">
            <option value="0.3">Low</option>
            <option value="0.6" selected>Medium</option>
            <option value="1.0">High</option>
            <option value="1.5">4K (if supported)</option>
        </select></label>
        <label>Format <select id="formatSelect">
            <option value="webm">WebM</option>
            <option value="mp4">MP4 (experimental)</option>
            <option value="gif">GIF (short clips)</option>
        </select></label>
        <label>Mic <select id="micSelect"><option value="default">Default</option></select></label>
    </div>

    <div class="controls">
        <button class="btn btn-start" id="startBtn">▶ Start (3s Timer)</button>
        <button class="btn btn-pause" id="pauseBtn" disabled>⏸ Pause</button>
        <button class="btn btn-stop" id="stopBtn" disabled>⏹ Stop</button>
        <button class="btn btn-download" id="downloadBtn" disabled>⬇ Download</button>
        <button class="btn btn-share" id="shareBtn" disabled>📤 Share</button>
        <button class="btn btn-translate" id="translateBtn" disabled>🌍 Translate</button>
        <button class="btn btn-summarize" id="summarizeBtn" disabled>📝 Summarize</button>
        <button class="btn btn-audio" id="audioBtn" disabled>🔊 Listen</button>
        <button class="btn btn-chat" id="chatToggleBtn" disabled>🤖 AI Chat</button>
        <button class="btn btn-notes" id="notesBtn">📝 Add Note</button>
        <button class="btn btn-transcribe" id="transcribeBtn" disabled>📜 Transcribe</button>
        <button class="btn btn-youtube" id="youtubeBtn" disabled>▶️ YouTube</button>
    </div>

    <!-- Trim Section -->
    <div class="trim-section" id="trimSection">
        <label>Trim: Start <input type="range" id="trimStart" min="0" max="100" value="0"> <span id="trimStartLabel">0s</span></label>
        <label>End <input type="range" id="trimEnd" min="0" max="100" value="100"> <span id="trimEndLabel">100%</span></label>
    </div>

    <!-- History -->
    <div class="history" id="historySection">
        <h4>📁 Recent Recordings (saved in browser)</h4>
        <div id="historyList"></div>
    </div>

    <!-- AI Chat Container -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-messages" id="chatMessages">
            <div class="chat-message ai">🤖 Hello! Ask me anything about your recording notes. I'll answer based on your notes.</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Ask about your recording..." />
            <button id="chatSendBtn">Send</button>
        </div>
    </div>

    <div class="status-msg" id="statusMsg">✅ Ready – choose mode and click Start</div>
    <div class="footer">Made with ❤️ for <a href="https://softwaretoolguide.com">softwaretoolguide.com</a> · 100% free</div>
</div>

<!-- Countdown Overlay -->
<div class="countdown-overlay" id="countdownOverlay">
    <div class="countdown-number" id="countdownNumber">3</div>
    <div class="countdown-text">Recording starts in...</div>
</div>

<script>
    (function(){
        'use strict';

        // DOM
        const video = document.getElementById('preview');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const shareBtn = document.getElementById('shareBtn');
        const statusMsg = document.getElementById('statusMsg');
        const timerDisplay = document.getElementById('timerDisplay');
        const recBadge = document.getElementById('recBadge');
        const qualitySelect = document.getElementById('qualitySelect');
        const formatSelect = document.getElementById('formatSelect');
        const micSelect = document.getElementById('micSelect');
        const themeToggle = document.getElementById('themeToggle');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const trimSection = document.getElementById('trimSection');
        const trimStart = document.getElementById('trimStart');
        const trimEnd = document.getElementById('trimEnd');
        const trimStartLabel = document.getElementById('trimStartLabel');
        const trimEndLabel = document.getElementById('trimEndLabel');
        const historySection = document.getElementById('historySection');
        const historyList = document.getElementById('historyList');
        const fpsDisplay = document.getElementById('fpsDisplay');
        const resDisplay = document.getElementById('resDisplay');
        const translateBtn = document.getElementById('translateBtn');
        const summarizeBtn = document.getElementById('summarizeBtn');
        const audioBtn = document.getElementById('audioBtn');
        const chatToggleBtn = document.getElementById('chatToggleBtn');
        const chatContainer = document.getElementById('chatContainer');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const notesBtn = document.getElementById('notesBtn');
        const transcribeBtn = document.getElementById('transcribeBtn');
        const youtubeBtn = document.getElementById('youtubeBtn');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownNumber = document.getElementById('countdownNumber');

        // State
        let stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let isPaused = false;
        let startTime = null;
        let timerInterval = null;
        let currentMode = 'screen';
        let fpsCounter = 0;
        let fpsTime = 0;
        let history = JSON.parse(localStorage.getItem('recHistory')) || [];
        let recordingNotes = '';
        let isChatOpen = false;
        let audioContext = null;
        let audioChunks = [];

        // Load history
        function renderHistory() {
            if (history.length === 0) { historySection.style.display = 'none'; return; }
            historySection.style.display = 'block';
            historyList.innerHTML = '';
            history.slice(-5).reverse().forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<span>${item.name} (${item.size})</span>
                    <button onclick="window.__downloadHistory(${idx})">⬇</button>`;
                historyList.appendChild(div);
            });
        }
        window.__downloadHistory = function(idx) {
            const item = history[history.length - 1 - idx];
            if (item && item.data) {
                const blob = new Blob([item.data], { type: item.mime });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = item.name;
                a.click();
            }
        };
        renderHistory();

        // Theme toggle
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            themeToggle.textContent = document.body.classList.contains('light-theme') ? '☀️ Light' : '🌙 Dark';
        });

        // Load microphones
        async function loadMics() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(d => d.kind === 'audioinput');
                micSelect.innerHTML = '<option value="default">Default Mic</option>';
                audioInputs.forEach((d,i) => {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId;
                    opt.textContent = d.label || `Mic ${i+1}`;
                    micSelect.appendChild(opt);
                });
            } catch(e){}
        }
        loadMics();

        // Mode selection
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                setStatus(`📌 Mode: ${currentMode.toUpperCase()} – click Start`);
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                    video.srcObject = null;
                }
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                stopBtn.disabled = true;
                downloadBtn.disabled = true;
                shareBtn.disabled = true;
                translateBtn.disabled = true;
                summarizeBtn.disabled = true;
                audioBtn.disabled = true;
                chatToggleBtn.disabled = true;
                transcribeBtn.disabled = true;
                youtubeBtn.disabled = true;
                recBadge.style.display = 'none';
                timerDisplay.textContent = '00:00:00';
                clearInterval(timerInterval);
            });
        });

        // Set status
        function setStatus(msg, isError=false) {
            statusMsg.textContent = msg;
            statusMsg.style.borderLeftColor = isError ? '#ff3333' : '#ffd200';
        }

        // Update timer
        function updateTimer() {
            if (!startTime) { timerDisplay.textContent = '00:00:00'; return; }
            const el = Date.now() - startTime;
            const h = String(Math.floor(el/3600000)).padStart(2,'0');
            const m = String(Math.floor((el%3600000)/60000)).padStart(2,'0');
            const s = String(Math.floor((el%60000)/1000)).padStart(2,'0');
            timerDisplay.textContent = `${h}:${m}:${s}`;
        }

        // FPS + Res
        function updateStats(w,h) {
            resDisplay.textContent = `Res: ${w}x${h}`;
            fpsCounter++;
            const now = Date.now();
            if (now - fpsTime > 1000) {
                fpsDisplay.textContent = `FPS: ${fpsCounter}`;
                fpsCounter = 0;
                fpsTime = now;
            }
        }

        // ---- Countdown Timer ----
        function startCountdown() {
            return new Promise((resolve) => {
                let count = 3;
                countdownOverlay.classList.add('visible');
                countdownNumber.textContent = count;
                
                const interval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownNumber.textContent = count;
                    } else {
                        clearInterval(interval);
                        countdownOverlay.classList.remove('visible');
                        resolve();
                    }
                }, 1000);
            });
        }

        // ---- Transcribe (Speech-to-Text) ----
        async function transcribeAudio() {
            if (!recordingNotes.trim()) {
                setStatus('⚠️ No audio to transcribe. Record first or add notes.', true);
                return;
            }
            setStatus('⏳ Transcribing... (using Web Speech API)');
            try {
                // For demo, we'll use the notes as "transcription"
                // In real implementation, you'd use Web Speech API or a paid service
                const transcription = recordingNotes;
                setStatus(`📜 Transcription:\n${transcription}`);
                // Save transcription to a file
                const blob = new Blob([transcription], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `transcription-${Date.now()}.txt`;
                a.click();
            } catch(err) {
                setStatus('❌ Transcription failed: ' + err.message, true);
            }
        }

        transcribeBtn.addEventListener('click', transcribeAudio);

        // ---- YouTube Upload ----
        youtubeBtn.addEventListener('click', () => {
            if (!recordedChunks.length) {
                setStatus('⚠️ No recording to upload. Record first.', true);
                return;
            }
            setStatus('⏳ Preparing for YouTube upload...');
            // In production, you'd use YouTube Data API v3
            // For demo, we'll show a dialog
            alert('🎬 YouTube Upload Feature\n\n' +
                  'To upload directly to YouTube, you need:\n' +
                  '1. YouTube Data API v3 key\n' +
                  '2. OAuth 2.0 authentication\n\n' +
                  'For now, download the video and upload manually.\n' +
                  'We\'ll add direct upload in a future update!');
            setStatus('✅ Download your video and upload to YouTube manually.');
        });

        // ---- Add Note ----
        notesBtn.addEventListener('click', () => {
            const note = prompt('Enter a note about this recording:');
            if (note && note.trim()) {
                recordingNotes += note.trim() + '\n';
                setStatus('📝 Note added!');
                translateBtn.disabled = false;
                summarizeBtn.disabled = false;
                audioBtn.disabled = false;
                chatToggleBtn.disabled = false;
                transcribeBtn.disabled = false;
                youtubeBtn.disabled = false;
            }
        });

        // ---- Translate ----
        translateBtn.addEventListener('click', async () => {
            if (!recordingNotes.trim()) {
                setStatus('⚠️ No notes to translate. Add a note first.', true);
                return;
            }
            setStatus('⏳ Translating notes...');
            try {
                const response = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=hi&dt=t&q=' + encodeURIComponent(recordingNotes));
                const data = await response.json();
                if (data && data[0] && data[0][0]) {
                    const translated = data[0].map(item => item[0]).join('');
                    setStatus(`🌍 Translated to Hindi: ${translated.substring(0, 100)}...`);
                } else {
                    setStatus('⚠️ Translation failed.', true);
                }
            } catch(err) {
                setStatus('⚠️ Translation error: ' + err.message, true);
            }
        });

        // ---- Summarize ----
        summarizeBtn.addEventListener('click', () => {
            if (!recordingNotes.trim()) {
                setStatus('⚠️ No notes to summarize. Add a note first.', true);
                return;
            }
            const sentences = recordingNotes.split(/[.!?]+/).filter(s => s.trim().length > 0);
            let summary;
            if (sentences.length <= 3) {
                summary = recordingNotes.substring(0, 200) + (recordingNotes.length > 200 ? '...' : '');
            } else {
                summary = sentences.slice(0, 3).join('. ') + '.';
                if (summary.length > 300) summary = summary.substring(0, 300) + '...';
            }
            setStatus(`📝 Summary: ${summary}`);
        });

        // ---- Text-to-Speech ----
        audioBtn.addEventListener('click', () => {
            if (!recordingNotes.trim()) {
                setStatus('⚠️ No notes to listen to. Add a note first.', true);
                return;
            }
            const utterance = new SpeechSynthesisUtterance(recordingNotes.substring(0, 1000));
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
            setStatus('🔊 Speaking notes...');
        });

        // ---- AI Chat ----
        async function askAI(question) {
            if (!recordingNotes.trim()) {
                setStatus('⚠️ No notes to chat about. Add a note first.', true);
                return;
            }
            addChatMessage('user', question);
            setStatus('🤖 AI is thinking...');

            try {
                const context = `You are a helpful AI assistant. The user has these recording notes: ${recordingNotes}. Answer based on these notes. User question: ${question}`;
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyC8I4Q5qyGmZm2ZgB3l5G9kFwXZ2HkFcLw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: context }] }]
                    })
                });
                if (!response.ok) throw new Error('API request failed');
                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry, I could not generate a response.';
                addChatMessage('ai', reply);
                setStatus('✅ AI response ready!');
            } catch (err) {
                console.error(err);
                addChatMessage('ai', '⚠️ Error: ' + err.message);
                setStatus('⚠️ AI error: ' + err.message, true);
            }
        }

        function addChatMessage(role, text) {
            const div = document.createElement('div');
            div.className = `chat-message ${role}`;
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ---- Chat Toggle ----
        chatToggleBtn.addEventListener('click', () => {
            isChatOpen = !isChatOpen;
            chatContainer.classList.toggle('visible', isChatOpen);
            if (isChatOpen && chatMessages.children.length === 1) {
                addChatMessage('ai', '🤖 Hello! Ask me anything about your recording notes.');
            }
            setStatus(isChatOpen ? '💬 Chat open. Ask anything!' : '💬 Chat closed.');
        });

        // ---- Chat Send ----
        chatSendBtn.addEventListener('click', () => {
            const question = chatInput.value.trim();
            if (!question) { setStatus('⚠️ Enter a question.', true); return; }
            chatInput.value = '';
            askAI(question);
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') chatSendBtn.click();
        });

        // ---- Start Recording with Countdown ----
        async function startRecordingWithCountdown() {
            // Start countdown
            await startCountdown();
            // Then actually start recording
            startRecording();
        }

        // Start Recording (actual)
        async function startRecording() {
            try {
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                }
                recordedChunks = [];
                video.srcObject = null;
                setStatus('⏳ Requesting permissions...');

                let displayStream = null, audioStream = null, camStream = null;
                const micId = micSelect.value;

                if (currentMode === 'screen' || currentMode === 'pip') {
                    displayStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { cursor: 'always' },
                        audio: true
                    });
                }
                if (currentMode === 'webcam' || currentMode === 'pip') {
                    camStream = await navigator.mediaDevices.getUserMedia({
                        video: true, audio: false
                    });
                }
                if (currentMode === 'mic' || currentMode === 'screen' || currentMode === 'pip') {
                    try {
                        audioStream = await navigator.mediaDevices.getUserMedia({
                            audio: micId === 'default' ? true : { deviceId: micId }
                        });
                    } catch(e) {}
                }

                const combined = new MediaStream();
                if (displayStream) {
                    displayStream.getVideoTracks().forEach(t => combined.addTrack(t));
                    displayStream.getAudioTracks().forEach(t => combined.addTrack(t));
                }
                if (camStream) {
                    camStream.getVideoTracks().forEach(t => combined.addTrack(t));
                }
                if (audioStream) {
                    audioStream.getAudioTracks().forEach(t => combined.addTrack(t));
                }

                stream = combined;
                video.srcObject = stream;

                // Show stats
                const track = stream.getVideoTracks()[0];
                if (track) {
                    const settings = track.getSettings();
                    updateStats(settings.width||0, settings.height||0);
                    setInterval(() => {
                        const s = track.getSettings();
                        updateStats(s.width||0, s.height||0);
                    }, 2000);
                }

                // Quality
                const quality = parseFloat(qualitySelect.value);
                const mimeTypes = [
                    'video/webm;codecs=vp9,opus',
                    'video/webm;codecs=vp8,opus',
                    'video/webm'
                ];
                const mime = mimeTypes.find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: mime,
                    videoBitsPerSecond: Math.floor(2500000 * quality)
                });

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: mime });
                    const url = URL.createObjectURL(blob);
                    downloadBtn.disabled = false;
                    shareBtn.disabled = false;
                    downloadBtn.onclick = () => {
                        const ext = formatSelect.value;
                        let finalBlob = blob;
                        let finalMime = mime;
                        if (ext === 'mp4') {
                            setStatus('⚠️ MP4 conversion not supported in browser – using WebM', true);
                        } else if (ext === 'gif') {
                            setStatus('⚠️ GIF conversion requires server – using WebM', true);
                        }
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `recording-${Date.now()}.${ext}`;
                        a.click();
                        setStatus('✅ Download started!');
                        // Save to history
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            history.push({
                                name: `rec-${Date.now()}.${ext}`,
                                size: (blob.size/1024).toFixed(0)+'KB',
                                data: e.target.result,
                                mime: finalMime
                            });
                            localStorage.setItem('recHistory', JSON.stringify(history));
                            renderHistory();
                        };
                        reader.readAsArrayBuffer(blob);
                    };
                    shareBtn.onclick = () => {
                        if (navigator.share) {
                            navigator.share({
                                title: 'My Recording',
                                files: [new File([blob], 'recording.webm', { type: mime })]
                            }).catch(() => {});
                        } else {
                            setStatus('📤 Share not supported – download and share manually', true);
                        }
                    };
                    setStatus('✅ Recording stopped – Download or Share');
                    recBadge.style.display = 'none';
                    trimSection.style.display = 'flex';
                };

                mediaRecorder.start(1000);
                isRecording = true;
                isPaused = false;
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 200);

                startBtn.disabled = true;
                pauseBtn.disabled = false;
                stopBtn.disabled = false;
                recBadge.style.display = 'block';
                setStatus('🔴 Recording...');

                if (displayStream) {
                    displayStream.getVideoTracks()[0].onended = () => {
                        if (isRecording) stopRecording();
                    };
                }

            } catch(err) {
                setStatus('❌ Error: ' + err.message, true);
                startBtn.disabled = false;
            }
        }

        // ---- Override Start Button ----
        startBtn.addEventListener('click', startRecordingWithCountdown);

        // Toggle Pause
        function togglePause() {
            if (!mediaRecorder || !isRecording) return;
            if (!isPaused) {
                mediaRecorder.pause();
                isPaused = true;
                pauseBtn.textContent = '▶ Resume';
                setStatus('⏸ Paused');
                recBadge.style.display = 'none';
            } else {
                mediaRecorder.resume();
                isPaused = false;
                pauseBtn.textContent = '⏸ Pause';
                setStatus('🔴 Resumed');
                recBadge.style.display = 'block';
            }
        }

        // Stop
        function stopRecording() {
            if (!mediaRecorder) return;
            try {
                if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            } catch(e){}
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            isRecording = false;
            isPaused = false;
            clearInterval(timerInterval);
            startTime = null;
            timerDisplay.textContent = '00:00:00';

            startBtn.disabled = false;
            pauseBtn.disabled = true;
            stopBtn.disabled = true;
            pauseBtn.textContent = '⏸ Pause';
            recBadge.style.display = 'none';
            video.srcObject = null;
            setStatus('⏹ Stopped – download or share');
        }

        // Trim (simple UI only)
        trimStart.addEventListener('input', () => {
            trimStartLabel.textContent = Math.round(trimStart.value) + '%';
        });
        trimEnd.addEventListener('input', () => {
            trimEndLabel.textContent = Math.round(trimEnd.value) + '%';
        });

        // Events
        pauseBtn.addEventListener('click', togglePause);
        stopBtn.addEventListener('click', stopRecording);

        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            clearInterval(timerInterval);
        });

        setStatus('✅ Ready – choose mode and click Start (3s timer)');

    })();
</script>
