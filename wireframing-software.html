        .ui-element { 
            position:absolute; 
            cursor:move; 
            border:1px solid #333; 
            background:#f0f0f0; 
            padding:8px 12px; 
            border-radius:4px; 
            min-width:60px;

        .ui-element.selected {

        .ui-element .delete-btn { 
            position:absolute; 
            top:-10px; 
            right:-10px; 
            background:#ff3333; 
            color:#fff; 
            border:none; 
            border-radius:50%; 
            width:20px; 
            height:20px; 
            cursor:pointer; 
            font-size:10px; 
            display:none; 
        }
        .ui-element:hover .delete-btn { display:block; }
        .ui-element .color-controls {
            position:absolute;
            bottom:-30px;
            left:0;
            display:none;
            gap:4px;
            background:var(--surface);
            padding:4px;
            border-radius:4px;
            border:1px solid var(--border);
            z-index:10;

        .ui-element:hover .color-controls { display:flex; }

            width:20px;
            height:20px;
            border:none;
            padding:0;
            cursor:pointer;
            border-radius:50%;
        }

        /* Resize handles */
        .resize-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #2979ff;
            border: 1px solid #fff;
            border-radius: 50%;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .ui-element:hover .resize-handle { opacity: 1; }
        .resize-handle.nw { top: -4px; left: -4px; cursor: nw-resize; }
        .resize-handle.ne { top: -4px; right: -4px; cursor: ne-resize; }
        .resize-handle.sw { bottom: -4px; left: -4px; cursor: sw-resize; }
        .resize-handle.se { bottom: -4px; right: -4px; cursor: se-resize; }
        .resize-handle.n { top: -4px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
        .resize-handle.s { bottom: -4px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
        .resize-handle.e { top: 50%; right: -4px; transform: translateY(-50%); cursor: e-resize; }
        .resize-handle.w { top: 50%; left: -4px; transform: translateY(-50%); cursor: w-resize; }

        const downloadTxtBtn = document.getElementById('downloadTxtBtn');
        const downloadDocxBtn = document.getElementById('downloadDocxBtn');
        const translateBtn = document.getElementById('translateBtn');
        const summarizeBtn = document.getElementById('summarizeBtn');
        const audioBtn = document.getElementById('audioBtn');
        const chatToggleBtn = document.getElementById('chatToggleBtn');
        const chatContainer = document.getElementById('chatContainer');
        const chatMessages = document.getElementById('chatMessages');

        const chatSendBtn = document.getElementById('chatSendBtn');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const bringForwardBtn = document.getElementById('bringForwardBtn');
        const sendBackwardBtn = document.getElementById('sendBackwardBtn');
        const bringToFrontBtn = document.getElementById('bringToFrontBtn');
        const sendToBackBtn = document.getElementById('sendToBackBtn');

        // ---- State ----
        let elements = JSON.parse(localStorage.getItem('wireframeElements')) || [];
        let selectedElement = null;
        let elementIdCounter = Date.now();
        let wireframeNotes = '';
        let isChatOpen = false;
        const GRID_SIZE = 20;

        // ---- Undo/Redo ----
        let historyStack = [];
        let redoStack = [];
        const MAX_HISTORY = 20;

        function pushHistory() {
            const snapshot = JSON.stringify(elements);
            historyStack.push(snapshot);
            if (historyStack.length > MAX_HISTORY) {
                historyStack.shift();
            }
            redoStack = [];
            updateUndoRedoButtons();
        }

        function undo() {
            if (historyStack.length <= 1) return;
            const current = historyStack.pop();
            redoStack.push(current);
            const prev = historyStack[historyStack.length - 1];
            elements = JSON.parse(prev);
            saveState();
            renderElements();
            updateUndoRedoButtons();
            setStatus('↩ Undo applied');
        }

        function redo() {
            if (redoStack.length === 0) return;
            const next = redoStack.pop();
            historyStack.push(next);
            elements = JSON.parse(next);
            saveState();
            renderElements();
            updateUndoRedoButtons();
            setStatus('↪ Redo applied');
        }

        function updateUndoRedoButtons() {
            undoBtn.disabled = historyStack.length <= 1;
            redoBtn.disabled = redoStack.length === 0;
        }

        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
            if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
        });

        // ---- Save state ----
        function saveState() { 
            localStorage.setItem('wireframeElements', JSON.stringify(elements)); 
        }

        function setStatus(msg, isError=false) {
            statusMsg.textContent = msg;
            statusMsg.style.borderLeftColor = isError ? '#ff3333' : '#ffd200';
        }

        // ---- Layer Management ----
        function bringForward() {
            if (!selectedElement) {
                setStatus('⚠️ Select an element first.', true);
                return;
            }
            const el = elements.find(e => e.id === selectedElement);
            if (!el) return;
            const idx = elements.indexOf(el);
            if (idx < elements.length - 1) {
                pushHistory();
                elements.splice(idx, 1);
                elements.splice(idx + 1, 0, el);
                saveState();
                renderElements();
                setStatus('⬆ Element brought forward');
            }
        }

        function sendBackward() {
            if (!selectedElement) {
                setStatus('⚠️ Select an element first.', true);
                return;
            }
            const el = elements.find(e => e.id === selectedElement);
            if (!el) return;
            const idx = elements.indexOf(el);
            if (idx > 0) {
                pushHistory();
                elements.splice(idx, 1);
                elements.splice(idx - 1, 0, el);
                saveState();
                renderElements();
                setStatus('⬇ Element sent backward');
            }
        }

        function bringToFront() {
            if (!selectedElement) {
                setStatus('⚠️ Select an element first.', true);
                return;
            }
            const el = elements.find(e => e.id === selectedElement);
            if (!el) return;
            pushHistory();
            const idx = elements.indexOf(el);
            elements.splice(idx, 1);
            elements.push(el);
            saveState();
            renderElements();
            setStatus('⬆⬆ Element brought to front');
        }

        function sendToBack() {
            if (!selectedElement) {
                setStatus('⚠️ Select an element first.', true);
                return;
            }
            const el = elements.find(e => e.id === selectedElement);
            if (!el) return;
            pushHistory();
            const idx = elements.indexOf(el);
            elements.splice(idx, 1);
            elements.unshift(el);
            saveState();
            renderElements();
            setStatus('⬇⬇ Element sent to back');
        }

        bringForwardBtn.addEventListener('click', bringForward);
        sendBackwardBtn.addEventListener('click', sendBackward);
        bringToFrontBtn.addEventListener('click', bringToFront);
        sendToBackBtn.addEventListener('click', sendToBack);

        // ---- Templates ----
        const templates = {

                { id: `el_${Date.now() + 7}`, type: 'input', x: 40, y: 440, width: 320, height: 40, text: 'Password', color: '#fff', textColor: '#333' },
                { id: `el_${Date.now() + 8}`, type: 'text', x: 50, y: 520, width: 300, height: 40, text: 'Forgot Password?', color: '#f0f0f0', textColor: '#2979ff' },
                { id: `el_${Date.now() + 9}`, type: 'text', x: 50, y: 580, width: 300, height: 40, text: 'Don\'t have account? Sign up', color: '#f0f0f0', textColor: '#333' },
            ],

                { id: `el_${Date.now() + 10}`, type: 'box', x: 20, y: 20, width: 900, height: 500, text: 'Desktop Layout', color: '#e8f0fe', textColor: '#333' },

                { id: `el_${Date.now() + 25}`, type: 'button', x: 220, y: 160, width: 150, height: 40, text: 'Learn More', color: '#2979ff', textColor: '#fff' },
                { id: `el_${Date.now() + 26}`, type: 'box', x: 40, y: 220, width: 260, height: 180, text: 'Feature 1', color: '#e8e8e8', textColor: '#333' },
                { id: `el_${Date.now() + 27}`, type: 'box', x: 320, y: 220, width: 260, height: 180, text: 'Feature 2', color: '#e8e8e8', textColor: '#333' },

            dashboard: [
                { id: `el_${Date.now() + 30}`, type: 'box', x: 20, y: 20, width: 900, height: 500, text: 'Dashboard', color: '#e8f0fe', textColor: '#333' },
                { id: `el_${Date.now() + 31}`, type: 'box', x: 40, y: 40, width: 250, height: 460, text: 'Sidebar', color: '#f5f5f5', textColor: '#333' },
                { id: `el_${Date.now() + 32}`, type: 'text', x: 50, y: 50, width: 200, height: 30, text: '📊 Dashboard', color: '#f0f0f0', textColor: '#333' },
                { id: `el_${Date.now() + 33}`, type: 'box', x: 310, y: 40, width: 580, height: 140, text: 'Stats Overview', color: '#e8e8e8', textColor: '#333' },
                { id: `el_${Date.now() + 34}`, type: 'box', x: 310, y: 200, width: 270, height: 140, text: 'Chart 1', color: '#e8e8e8', textColor: '#333' },
                { id: `el_${Date.now() + 35}`, type: 'box', x: 600, y: 200, width: 290, height: 140, text: 'Chart 2', color: '#e8e8e8', textColor: '#333' },
                { id: `el_${Date.now() + 36}`, type: 'box', x: 310, y: 360, width: 580, height: 120, text: 'Recent Activity', color: '#e8e8e8', textColor: '#333' },
            ],
            login: [
                { id: `el_${Date.now() + 40}`, type: 'box', x: 20, y: 20, width: 900, height: 500, text: 'Login Page', color: '#e8f0fe', textColor: '#333' },
                { id: `el_${Date.now() + 41}`, type: 'box', x: 250, y: 50, width: 400, height: 400, text: 'Login Form', color: '#fff', textColor: '#333' },
                { id: `el_${Date.now() + 42}`, type: 'text', x: 300, y: 80, width: 300, height: 50, text: '🔐 Welcome Back', color: '#f0f0f0', textColor: '#2979ff' },
                { id: `el_${Date.now() + 43}`, type: 'text', x: 300, y: 130, width: 300, height: 30, text: 'Please login to your account', color: '#f0f0f0', textColor: '#888' },
                { id: `el_${Date.now() + 44}`, type: 'input', x: 280, y: 180, width: 340, height: 40, text: 'Email', color: '#fff', textColor: '#333' },
                { id: `el_${Date.now() + 45}`, type: 'input', x: 280, y: 240, width: 340, height: 40, text: 'Password', color: '#fff', textColor: '#333' },
                { id: `el_${Date.now() + 46}`, type: 'button', x: 280, y: 300, width: 340, height: 50, text: 'Sign In', color: '#2979ff', textColor: '#fff' },
                { id: `el_${Date.now() + 47}`, type: 'text', x: 300, y: 380, width: 300, height: 30, text: 'Forgot password? Reset', color: '#f0f0f0', textColor: '#2979ff' },
                { id: `el_${Date.now() + 48}`, type: 'text', x: 300, y: 410, width: 300, height: 30, text: 'Don\'t have account? Sign up', color: '#f0f0f0', textColor: '#333' },
            ]
        };

        function loadTemplate(templateName) {
            const template = templates[templateName];
            if (!template) return;
            
            // Generate unique IDs for template elements
            const newElements = template.map(el => ({
                ...el,
                id: `el_${elementIdCounter++}`
            }));
            
            pushHistory();
            elements = elements.concat(newElements);
            saveState();
            renderElements();
            setStatus(`✅ Template loaded: ${templateName}`);
        }

        document.querySelectorAll('.template-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const template = btn.dataset.template;
                loadTemplate(template);
            });
        });

        // ---- Render elements ----
        function renderElements() {
            canvas.innerHTML = '';
            let elementCount = 0;
            
            elements.forEach(el => {
                const div = document.createElement('div');
                div.className = 'ui-element' + (selectedElement === el.id ? ' selected' : '');
                div.dataset.id = el.id;
                div.style.left = el.x + 'px';
                div.style.top = el.y + 'px';
                div.style.width = el.width + 'px';
                div.style.height = el.height + 'px';
                div.style.background = el.color || '#f0f0f0';
                div.style.color = el.textColor || '#333';
                div.textContent = el.text || el.type;
                div.style.zIndex = el.zIndex || 0;

                // Element type specific styling
                if (el.type === 'arrow') {
                    div.textContent = '➡️';
                    div.style.fontSize = '30px';
                    div.style.background = 'transparent';
                    div.style.border = 'none';
                }
                if (el.type === 'image') {
                    div.textContent = '🖼 Image';
                    div.style.background = '#e0e0e0';
                    div.style.color = '#888';
                }
                if (el.type === 'input') {
                    div.textContent = '✏️ Input';
                    div.style.background = '#fff';
                    div.style.border = '1px solid #ccc';
                }

                // Color controls
                const colorControls = document.createElement('div');
                colorControls.className = 'color-controls';
                colorControls.innerHTML = `
                    <input type="color" class="bg-color" value="${el.color || '#f0f0f0'}" title="Background Color" />
                    <input type="color" class="text-color" value="${el.textColor || '#333'}" title="Text Color" />
                `;
                div.appendChild(colorControls);

                // Delete button
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '✕';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    pushHistory();
                    elements = elements.filter(e => e.id !== el.id);
                    saveState();
                    renderElements();
                    setStatus('🗑 Element deleted');
                });
                div.appendChild(delBtn);

                // Resize handles
                ['nw', 'ne', 'sw', 'se', 'n', 's', 'e', 'w'].forEach(dir => {
                    const handle = document.createElement('div');
                    handle.className = `resize-handle ${dir}`;
                    handle.dataset.dir = dir;
                    handle.addEventListener('mousedown', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        startResize(e, el, dir);
                    });
                    div.appendChild(handle);
                });

                // Drag
                makeDraggable(div, el);

                // Select
                div.addEventListener('click', () => {
                    selectedElement = el.id;
                    renderElements();
                });

                // Color change handlers
                const bgColorInput = colorControls.querySelector('.bg-color');
                const textColorInput = colorControls.querySelector('.text-color');
                
                bgColorInput.addEventListener('input', (e) => {
                    pushHistory();
                    el.color = e.target.value;
                    saveState();
                    renderElements();
                    setStatus(`🎨 Background color changed`);
                });

                textColorInput.addEventListener('input', (e) => {
                    pushHistory();
                    el.textColor = e.target.value;
                    saveState();
                    renderElements();
                    setStatus(`🎨 Text color changed`);
                });

                canvas.appendChild(div);
                elementCount++;
            });

            // Update header with count
            document.querySelector('.header h1').textContent = `🎨 Free Wireframing Tool (${elementCount} elements)`;
            exportPdfBtn.disabled = (elementCount === 0);
            if (elementCount > 0 && wireframeNotes.trim()) {
                enableButtons();
            }
        }

        // ---- Resize Logic ----
        function startResize(e, el, dir) {
            e.stopPropagation();
            const startX = e.clientX;
            const startY = e.clientY;
            const origX = el.x;
            const origY = el.y;
            const origW = el.width;
            const origH = el.height;

            function onMouseMove(moveEvent) {
                const dx = moveEvent.clientX - startX;
                const dy = moveEvent.clientY - startY;
                
                // Snap to grid
                let newX = el.x, newY = el.y, newW = el.width, newH = el.height;

                if (dir.includes('e')) {
                    newW = Math.max(20, Math.round((origW + dx) / GRID_SIZE) * GRID_SIZE);
                }
                if (dir.includes('w')) {
                    newW = Math.max(20, Math.round((origW - dx) / GRID_SIZE) * GRID_SIZE);
                    newX = origX + (origW - newW);
                }
                if (dir.includes('s')) {
                    newH = Math.max(20, Math.round((origH + dy) / GRID_SIZE) * GRID_SIZE);
                }
                if (dir.includes('n')) {
                    newH = Math.max(20, Math.round((origH - dy) / GRID_SIZE) * GRID_SIZE);
                    newY = origY + (origH - newH);
                }

                // For corner handles, update both dimensions
                if (dir === 'nw' || dir === 'ne' || dir === 'sw' || dir === 'se') {
                    const w = Math.max(20, Math.round((origW + dx) / GRID_SIZE) * GRID_SIZE);
                    const h = Math.max(20, Math.round((origH + dy) / GRID_SIZE) * GRID_SIZE);
                    newW = w;
                    newH = h;
                    if (dir.includes('w')) newX = origX + (origW - w);
                    if (dir.includes('n')) newY = origY + (origH - h);
                }

                // Apply changes
                el.x = Math.round(newX / GRID_SIZE) * GRID_SIZE;
                el.y = Math.round(newY / GRID_SIZE) * GRID_SIZE;
                el.width = Math.round(newW / GRID_SIZE) * GRID_SIZE;
                el.height = Math.round(newH / GRID_SIZE) * GRID_SIZE;

                // Update DOM
                const elDiv = document.querySelector(`.ui-element[data-id="${el.id}"]`);
                if (elDiv) {
                    elDiv.style.left = el.x + 'px';
                    elDiv.style.top = el.y + 'px';
                    elDiv.style.width = el.width + 'px';
                    elDiv.style.height = el.height + 'px';
                }
            }

            function onMouseUp() {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
                pushHistory();
                saveState();
                renderElements();
                setStatus('📐 Element resized');
            }

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        // ---- Drag Logic ----
        function makeDraggable(el, data) {
            let isDragging = false;
            let startX, startY, origX, origY;

            el.addEventListener('mousedown', (e) => {
                if (e.target.closest('.color-controls') || e.target.closest('.resize-handle') || e.target.classList.contains('delete-btn')) return;
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                origX = data.x;
                origY = data.y;
                el.style.cursor = 'grabbing';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                // Snap to grid
                data.x = Math.round(Math.max(0, origX + dx) / GRID_SIZE) * GRID_SIZE;
                data.y = Math.round(Math.max(0, origY + dy) / GRID_SIZE) * GRID_SIZE;
                el.style.left = data.x + 'px';
                el.style.top = data.y + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    el.style.cursor = 'move';
                    pushHistory();
                    saveState();
                }
            });
        }

        // ---- Add Element ----
        function addElement(type) {
            const el = {
                id: `el_${elementIdCounter++}`,
                type: type,
                x: Math.round((50 + Math.random() * 100) / GRID_SIZE) * GRID_SIZE,
                y: Math.round((50 + Math.random() * 100) / GRID_SIZE) * GRID_SIZE,
                width: type === 'button' ? 120 : type === 'input' ? 200 : 100,
                height: type === 'button' ? 40 : type === 'input' ? 36 : 60,
                text: type.charAt(0).toUpperCase() + type.slice(1),
                color: type === 'button' ? '#2979ff' : '#f0f0f0',
                textColor: type === 'button' ? '#fff' : '#333',
                zIndex: elements.length
            };
            pushHistory();
            elements.push(el);
            saveState();
            renderElements();
            setStatus(`✅ ${type} added`);
        }

        // ---- Add Note ----
        addNoteBtn.addEventListener('click', () => {
            const note = prompt('Enter a note about this wireframe:');
            if (note && note.trim()) {
                wireframeNotes += note.trim() + '\n';
                setStatus('📝 Note added!');
                enableButtons();
            }
        });

        // ---- Enable AI buttons ----
        function enableButtons() {
            downloadTxtBtn.disabled = false;
            downloadDocxBtn.disabled = false;
            translateBtn.disabled = false;
            summarizeBtn.disabled = false;
            audioBtn.disabled = false;
            chatToggleBtn.disabled = false;
        }

        // ---- Translate ----
        translateBtn.addEventListener('click', async () => {
            if (!wireframeNotes.trim()) {
                setStatus('⚠️ No notes to translate. Add a note first.', true);
                return;
            }
            setStatus('⏳ Translating notes...');
            try {
                const response = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=hi&dt=t&q=' + encodeURIComponent(wireframeNotes));
                const data = await response.json();
                if (data && data[0] && data[0][0]) {
                    const translated = data[0].map(item => item[0]).join('');
                    setStatus(`🌍 Translated to Hindi: ${translated.substring(0, 100)}...`);
                } else {
                    setStatus('⚠️ Translation failed.', true);
                }
            } catch(err) {
                setStatus('⚠️ Translation error: ' + err.message, true);
            }
        });

        // ---- Summarize ----
        summarizeBtn.addEventListener('click', () => {
            if (!wireframeNotes.trim()) {
                setStatus('⚠️ No notes to summarize. Add a note first.', true);
                return;
            }
            const sentences = wireframeNotes.split(/[.!?]+/).filter(s => s.trim().length > 0);
            let summary;
            if (sentences.length <= 3) {
                summary = wireframeNotes.substring(0, 200) + (wireframeNotes.length > 200 ? '...' : '');
            } else {
                summary = sentences.slice(0, 3).join('. ') + '.';
                if (summary.length > 300) summary = summary.substring(0, 300) + '...';
            }
            setStatus(`📝 Summary: ${summary}`);
        });

        // ---- Text-to-Speech ----
        audioBtn.addEventListener('click', () => {
            if (!wireframeNotes.trim()) {
                setStatus('⚠️ No notes to listen to. Add a note first.', true);
                return;
            }
            const utterance = new SpeechSynthesisUtterance(wireframeNotes.substring(0, 1000));
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
            setStatus('🔊 Speaking notes...');
        });

        // ---- AI Chat ----
        async function askAI(question) {
            if (!wireframeNotes.trim()) {
                setStatus('⚠️ No notes to chat about. Add a note first.', true);
                return;
            }
            addChatMessage('user', question);
            setStatus('🤖 AI is thinking...');

            try {
                const context = `You are a helpful AI assistant. The user has these wireframe notes: ${wireframeNotes}. Answer based on these notes. User question: ${question}`;
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyC8I4Q5qyGmZm2ZgB3l5G9kFwXZ2HkFcLw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: context }] }]
                    })
                });
                if (!response.ok) throw new Error('API request failed');
                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry, I could not generate a response.';
                addChatMessage('ai', reply);
                setStatus('✅ AI response ready!');
            } catch (err) {
                console.error(err);
                addChatMessage('ai', '⚠️ Error: ' + err.message);
                setStatus('⚠️ AI error: ' + err.message, true);
            }
        }

        function addChatMessage(role, text) {
            const div = document.createElement('div');
            div.className = `chat-message ${role}`;
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ---- Chat Toggle ----
        chatToggleBtn.addEventListener('click', () => {
            isChatOpen = !isChatOpen;
            chatContainer.classList.toggle('visible', isChatOpen);
            if (isChatOpen && chatMessages.children.length === 1) {
                addChatMessage('ai', '🤖 Hello! Ask me anything about your wireframe and notes.');
            }
            setStatus(isChatOpen ? '💬 Chat open. Ask anything!' : '💬 Chat closed.');
        });

        // ---- Chat Send ----
        chatSendBtn.addEventListener('click', () => {
            const question = chatInput.value.trim();
            if (!question) { setStatus('⚠️ Enter a question.', true); return; }
            chatInput.value = '';
            askAI(question);
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') chatSendBtn.click();
        });

        // ---- Download .txt ----
        downloadTxtBtn.addEventListener('click', () => {
            const text = wireframeNotes || 'No notes added.';
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `wireframe-notes-${Date.now()}.txt`;
            a.click();
            setStatus('✅ .txt file downloaded!');
        });

        // ---- Download .docx ----
        downloadDocxBtn.addEventListener('click', () => {
            const text = wireframeNotes || 'No notes added.';
            const htmlContent = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" 
                      xmlns:w="urn:schemas-microsoft-com:office:word" 
                      xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="UTF-8" /><title>Wireframe Notes</title>
                <style>body { font-family: Arial; font-size: 12pt; line-height: 1.5; }</style></head>
                <body>${text.replace(/\n/g, '<br />')}</body></html>
            `;
            const blob = new Blob([htmlContent], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `wireframe-notes-${Date.now()}.docx`;
            a.click();
            setStatus('✅ .docx file downloaded!');
        });

        // ---- Event listeners ----
        document.querySelectorAll('.element-btn').forEach(btn => {
            btn.addEventListener('click', () => addElement(btn.dataset.type));
        });

        addCustomBtn.addEventListener('click', () => {
            const type = prompt('Enter custom element name:');
            if (type && type.trim()) {
                addElement(type.trim());
            }
        });

        // ---- Export PNG ----
        exportBtn.addEventListener('click', () => {
            const rect = canvas.getBoundingClientRect();
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = rect.width;
            tempCanvas.height = rect.height;
            const ctx = tempCanvas.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            elements.forEach(el => {
                ctx.fillStyle = el.color || '#f0f0f0';
                ctx.fillRect(el.x, el.y, el.width, el.height);
                ctx.fillStyle = el.textColor || '#333';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(el.text || el.type, el.x + el.width/2, el.y + el.height/2);
            });
            const link = document.createElement('a');
            link.download = `wireframe-${Date.now()}.png`;
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
            setStatus('✅ Wireframe exported as PNG!');
        });

        // ---- Export PDF ----
        exportPdfBtn.addEventListener('click', () => {
            setStatus('⏳ Generating PDF...');
            const rect = canvas.getBoundingClientRect();
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = rect.width;
            tempCanvas.height = rect.height;
            const ctx = tempCanvas.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            elements.forEach(el => {
                ctx.fillStyle = el.color || '#f0f0f0';
                ctx.fillRect(el.x, el.y, el.width, el.height);
                ctx.fillStyle = el.textColor || '#333';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(el.text || el.type, el.x + el.width/2, el.y + el.height/2);
            });
            const imgData = tempCanvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.addImage(imgData, 'PNG', 10, 10, 190, 0);
            doc.save(`wireframe-${Date.now()}.pdf`);
            setStatus('✅ Wireframe exported as PDF!');
        });

        // ---- Clear ----
        clearBtn.addEventListener('click', () => {
            if (confirm('Clear all elements?')) {
                pushHistory();
                elements = [];
                wireframeNotes = '';
                saveState();
                renderElements();
                downloadTxtBtn.disabled = true;
                downloadDocxBtn.disabled = true;
                translateBtn.disabled = true;
                summarizeBtn.disabled = true;
                audioBtn.disabled = true;
                chatToggleBtn.disabled = true;
                chatContainer.classList.remove('visible');
                isChatOpen = false;
                chatMessages.innerHTML = '';
                setStatus('🗑 Canvas cleared');
            }
        });

        // ---- Theme ----
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            themeToggle.textContent = document.body.classList.contains('light-theme') ? '☀️ Light' : '🌙 Dark';
        });

        // ---- Init ----
        pushHistory(); // initial state
        renderElements();
        setStatus('✅ Drag elements from left. Click & drag to move, resize, or change colors.');
    })();
</script>
