<style>
/* ROOT VARIABLES & THEME */
:root {
--bg: #0f0f1a;
--surface: #1a1a2e;
--surface2: #12121f;
--border: #2a2a44;
--text: #e0e0e0;
--text2: #8888aa;
--accent: #ffd200;
--accent2: #f7971e;
--shadow: 0 20px 60px rgba(0,0,0,0.8);
--radius: 16px;
}
.light-theme {
--bg: #f0f2f5;
--surface: #ffffff;
--surface2: #e8eaed;
--border: #d0d2d6;
--text: #1a1a2e;
--text2: #555577;
--accent: #2979ff;
--accent2: #1565c0;
--shadow: 0 20px 60px rgba(0,0,0,0.1);
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, sans-serif;
transition: background 0.3s, color 0.3s, border 0.3s;
}
body {
background: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
justify-content: center;
padding: 20px;
}
.container {
background: var(--surface);
border-radius: var(--radius);
padding: 25px;
max-width: 1100px;
width: 100%;
box-shadow: var(--shadow);
border: 1px solid var(--border);
}

/* HEADER */
.header {
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
gap: 12px;
margin-bottom: 16px;
border-bottom: 1px solid var(--border);
padding-bottom: 12px;
}
.header h1 {
font-size: 24px;
font-weight: 700;
background: linear-gradient(135deg, var(--accent2), var(--accent));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}
.header-actions {
display: flex;
gap: 10px;
align-items: center;
flex-wrap: wrap;
}
.theme-toggle {
background: var(--surface2);
border: 1px solid var(--border);
color: var(--text);
padding: 6px 14px;
border-radius: 30px;
cursor: pointer;
font-size: 13px;
}
.btn {
padding: 8px 18px;
border: none;
border-radius: 30px;
font-weight: 600;
font-size: 13px;
cursor: pointer;
transition: 0.2s;
display: inline-flex;
align-items: center;
gap: 6px;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #0f0f1a; }
.btn-primary:hover:not(:disabled) { transform: scale(1.03); }
.btn-danger { background: #ff3333; color: #fff; }
.btn-danger:hover:not(:disabled) { transform: scale(1.03); }
.btn-success { background: #00c853; color: #0f0f1a; }
.btn-success:hover:not(:disabled) { transform: scale(1.03); }
.btn-outline {
background: transparent;
border: 1px solid var(--border);
color: var(--text);
}
.btn-outline:hover { border-color: var(--accent); }

/* UPLOAD ZONE */
.upload-zone {
border: 2px dashed var(--border);
border-radius: var(--radius);
padding: 30px 20px;
text-align: center;
color: var(--text2);
cursor: pointer;
transition: 0.3s;
margin-bottom: 16px;
}
.upload-zone:hover { border-color: var(--accent); background: var(--surface2); }
.upload-zone input { display: none; }

/* VIDEO PLAYER */
.video-wrapper {
background: #0a0a15;
border-radius: var(--radius);
padding: 10px;
border: 1px solid var(--border);
margin-bottom: 16px;
text-align: center;
}
#videoPreview {
max-width: 100%;
max-height: 400px;
border-radius: 8px;
background: #000;
}

/* CONTROLS */
.controls-row {
display: flex;
flex-wrap: wrap;
gap: 10px;
background: var(--surface2);
padding: 14px 18px;
border-radius: var(--radius);
border: 1px solid var(--border);
margin-bottom: 16px;
align-items: center;
}
.controls-row label {
font-size: 12px;
color: var(--text2);
display: flex;
flex-direction: column;
gap: 4px;
}
.controls-row input[type="range"] {
accent-color: var(--accent);
background: var(--surface);
height: 4px;
border-radius: 4px;
outline: none;
}
.controls-row select {
background: var(--surface);
border: 1px solid var(--border);
color: var(--text);
padding: 4px 8px;
border-radius: 8px;
font-size: 13px;
}

/* MERGE LIST */
.merge-list {
background: var(--surface2);
border-radius: var(--radius);
padding: 12px 16px;
border: 1px solid var(--border);
margin-bottom: 14px;
max-height: 150px;
overflow-y: auto;
}
.merge-list h4 { font-size: 14px; color: var(--text2); margin-bottom: 6px; }
.merge-item {
display: flex;
justify-content: space-between;
padding: 4px 0;
border-bottom: 1px solid var(--border);
font-size: 13px;
}
.merge-item button {
background: transparent;
border: none;
color: #ff3333;
cursor: pointer;
}

/* STATUS */
.status-msg {

.footer {

text-align: center;
border-top: 1px solid var(--border);
padding-top: 16px;
}
.footer a { color: var(--accent); text-decoration: none; }

@media (max-width:600px) {
.container { padding: 12px; }
.controls-row { flex-direction: column; align-items: stretch; }
}

<body>

<div class="container" id="app">
<!-- HEADER -->
<div class="header">
<h1>🎬 Free Online Video Editor</h1>
<div class="header-actions">
<button class="btn btn-danger" id="resetBtn" disabled>↺ Reset</button>
<button class="btn btn-success" id="exportBtn" disabled>⬇ Export MP4</button>
<button class="theme-toggle" id="themeToggle">🌙 Dark/Light</button>
</div>
</div>

<!-- UPLOAD -->
<div class="upload-zone" id="uploadZone">
<div>📁 Drag & drop video here or <strong>click to browse</strong> (MP4, WebM, AVI, MOV)</div>
<input type="file" id="fileInput" accept="video/*" multiple />
</div>

<!-- VIDEO PREVIEW -->
<div class="video-wrapper">
<video id="videoPreview" controls></video>
</div>

<!-- CONTROLS -->
<div class="controls-row">
<label>Trim Start <input type="range" id="trimStart" min="0" max="100" value="0"></label>
<label>Trim End <input type="range" id="trimEnd" min="0" max="100" value="100"></label>
<label>Speed <select id="speedSelect">
<option value="0.25">0.25x (Slow)</option>
<option value="0.5">0.5x</option>
<option value="1" selected>1x (Normal)</option>
<option value="1.5">1.5x</option>
<option value="2">2x (Fast)</option>
<option value="4">4x (Very Fast)</option>
</select></label>
<label>Volume <input type="range" id="volumeRange" min="0" max="100" value="100"></label>
<label><input type="checkbox" id="muteCheck"> Mute</label>
<button class="btn btn-primary" id="mergeBtn" disabled>➕ Merge Videos</button>
</div>

<!-- MERGE LIST -->
<div class="merge-list" id="mergeList" style="display:none;">
<h4>📂 Videos to Merge</h4>
<div id="mergeItems"></div>
</div>

<!-- STATUS -->
<div class="status-msg" id="statusMsg">✅ Upload a video to start editing.</div>

<div class="footer">
Made with ❤️ for <a href="https://softwaretoolguide.com">softwaretoolguide.com</a> · 100% free · No signup · Powered by FFmpeg.wasm
</div>
</div>

<script>
// ============================================================
// PROFESSIONAL VIDEO EDITOR – FULL JAVASCRIPT
// ============================================================

(function(){
'use strict';

// ---- DOM refs ----
const video = document.getElementById('videoPreview');
const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');
const trimStart = document.getElementById('trimStart');
const trimEnd = document.getElementById('trimEnd');
const speedSelect = document.getElementById('speedSelect');
const volumeRange = document.getElementById('volumeRange');
const muteCheck = document.getElementById('muteCheck');
const mergeBtn = document.getElementById('mergeBtn');
const mergeList = document.getElementById('mergeList');
const mergeItems = document.getElementById('mergeItems');
const resetBtn = document.getElementById('resetBtn');
const exportBtn = document.getElementById('exportBtn');
const statusMsg = document.getElementById('statusMsg');
const themeToggle = document.getElementById('themeToggle');

// ---- State ----
let uploadedFiles = [];
let currentFileIndex = 0;
let videoURL = null;
let isMerged = false;

// ---- Helper: set status ----
function setStatus(msg, isError=false) {
statusMsg.textContent = msg;
statusMsg.style.borderLeftColor = isError ? '#ff3333' : '#ffd200';
}

// ---- Load video ----
function loadVideo(file) {
if (!file) return;
const url = URL.createObjectURL(file);
video.src = url;
videoURL = url;
video.load();
video.onloadedmetadata = () => {
setStatus(`✅ Loaded: ${file.name} (${(file.size/1024/1024).toFixed(1)} MB)`);
resetBtn.disabled = false;
exportBtn.disabled = false;
mergeBtn.disabled = false;
// Update trim sliders
trimStart.max = video.duration;
trimEnd.max = video.duration;
trimEnd.value = video.duration;
trimStart.value = 0;
};
}

// ---- Upload handlers ----
uploadZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
const files = e.target.files;
if (files.length > 0) {
uploadedFiles = Array.from(files);
currentFileIndex = 0;
loadVideo(uploadedFiles[0]);
if (uploadedFiles.length > 1) {
mergeList.style.display = 'block';
renderMergeList();
}
}
});
uploadZone.addEventListener('dragover', (e) => {
e.preventDefault();
uploadZone.style.borderColor = 'var(--accent)';
});
uploadZone.addEventListener('dragleave', () => {
uploadZone.style.borderColor = 'var(--border)';
});
uploadZone.addEventListener('drop', (e) => {
e.preventDefault();
uploadZone.style.borderColor = 'var(--border)';
const files = e.dataTransfer.files;
if (files.length > 0) {
uploadedFiles = Array.from(files);
currentFileIndex = 0;
loadVideo(uploadedFiles[0]);
if (uploadedFiles.length > 1) {
mergeList.style.display = 'block';
renderMergeList();
}
}
});

// ---- Render merge list ----
function renderMergeList() {
mergeItems.innerHTML = '';
uploadedFiles.forEach((file, idx) => {
const div = document.createElement('div');
div.className = 'merge-item';
div.innerHTML = `
<span>${idx+1}. ${file.name}</span>
<button class="remove-merge" data-index="${idx}">✕</button>
`;
mergeItems.appendChild(div);
});
document.querySelectorAll('.remove-merge').forEach(btn => {
btn.addEventListener('click', () => {
const idx = parseInt(btn.dataset.index);
uploadedFiles.splice(idx, 1);
renderMergeList();
if (uploadedFiles.length === 0) mergeList.style.display = 'none';
if (uploadedFiles.length > 0 && currentFileIndex >= uploadedFiles.length) {
currentFileIndex = uploadedFiles.length - 1;
loadVideo(uploadedFiles[currentFileIndex]);
}
});
});
}

// ---- Merge videos (simulated with FFmpeg.wasm) ----
mergeBtn.addEventListener('click', async () => {
if (uploadedFiles.length < 2) {
setStatus('⚠️ Upload at least 2 videos to merge.', true);
return;
}
setStatus('⏳ Merging videos... (this may take a minute)');

// Load FFmpeg.wasm (CDN)
try {
const { createFFmpeg, fetchFile } = FFmpeg;
const ffmpeg = createFFmpeg({ log: false });
await ffmpeg.load();

// Write each video to FFmpeg filesystem
for (let i = 0; i < uploadedFiles.length; i++) {
const data = await fetchFile(uploadedFiles[i]);
ffmpeg.FS('writeFile', `input${i}.mp4`, data);
}

// Build concat command
const list = uploadedFiles.map((_, i) => `file 'input${i}.mp4'`).join('\n');
ffmpeg.FS('writeFile', 'list.txt', list);

// Run FFmpeg concat
await ffmpeg.run('-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', 'output.mp4');

// Read result
const data = ffmpeg.FS('readFile', 'output.mp4');
const blob = new Blob([data.buffer], { type: 'video/mp4' });
const url = URL.createObjectURL(blob);

// Show merged video
video.src = url;
videoURL = url;
isMerged = true;
setStatus(`✅ Merged ${uploadedFiles.length} videos successfully!`);
exportBtn.disabled = false;

// Cleanup
ffmpeg.FS('unlink', 'output.mp4');
uploadedFiles.forEach((_, i) => ffmpeg.FS('unlink', `input${i}.mp4`));
ffmpeg.FS('unlink', 'list.txt');
} catch (err) {
setStatus('❌ Merge failed: ' + err.message, true);
console.error(err);
}
});

// ---- Trim, Speed, Volume, Mute (using video playback) ----
function applyTrim() {
const start = parseFloat(trimStart.value);
const end = parseFloat(trimEnd.value);
if (start >= end) {
setStatus('⚠️ Start must be less than End', true);
return;
}
video.currentTime = start;
video.play();
setTimeout(() => {
video.pause();
setStatus(`✅ Trim set: ${start.toFixed(1)}s to ${end.toFixed(1)}s`);
}, 500);
}

trimStart.addEventListener('input', applyTrim);
trimEnd.addEventListener('input', applyTrim);

speedSelect.addEventListener('change', () => {
video.playbackRate = parseFloat(speedSelect.value);
setStatus(`⏩ Speed: ${speedSelect.value}x`);
});

volumeRange.addEventListener('input', () => {
video.volume = parseFloat(volumeRange.value) / 100;
});

muteCheck.addEventListener('change', () => {
video.muted = muteCheck.checked;
setStatus(muteCheck.checked ? '🔇 Muted' : '🔊 Unmuted');
});

// ---- Export (using FFmpeg.wasm) ----
exportBtn.addEventListener('click', async () => {
setStatus('⏳ Exporting video... (this may take a minute)');

try {
const { createFFmpeg, fetchFile } = FFmpeg;
const ffmpeg = createFFmpeg({ log: false, corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js' });
await ffmpeg.load();

// Get current video as blob
const response = await fetch(video.src);
const blob = await response.blob();
const data = await fetchFile(blob);
ffmpeg.FS('writeFile', 'input.mp4', data);

// Apply trim, speed, volume, mute
const start = parseFloat(trimStart.value);
const end = parseFloat(trimEnd.value);
const speed = parseFloat(speedSelect.value);
const volume = parseFloat(volumeRange.value) / 100;
const mute = muteCheck.checked ? 'volume=0' : `volume=${volume}`;

let args = ['-i', 'input.mp4'];
if (start > 0 || end < video.duration) {
args.push('-ss', start.toString(), '-to', end.toString());
}
if (speed !== 1) {
args.push('-filter:v', `setpts=${1/speed}*PTS`, '-filter:a', `atempo=${speed}`);
}
args.push('-af', mute);
args.push('-c', 'copy', 'output.mp4');

await ffmpeg.run(...args);

const output = ffmpeg.FS('readFile', 'output.mp4');
const outBlob = new Blob([output.buffer], { type: 'video/mp4' });
const url = URL.createObjectURL(outBlob);

// Download
const a = document.createElement('a');
a.href = url;
a.download = `edited-video-${Date.now()}.mp4`;
a.click();

setStatus('✅ Export complete! Download started.');

// Cleanup
ffmpeg.FS('unlink', 'input.mp4');
ffmpeg.FS('unlink', 'output.mp4');
} catch (err) {
setStatus('❌ Export failed: ' + err.message, true);
console.error(err);
}
});

// ---- Reset ----
resetBtn.addEventListener('click', () => {
if (uploadedFiles.length > 0) {
loadVideo(uploadedFiles[0]);
trimStart.value = 0;
trimEnd.value = video.duration || 100;
speedSelect.value = '1';
volumeRange.value = 100;
muteCheck.checked = false;
video.volume = 1;
video.muted = false;
video.playbackRate = 1;
setStatus('↺ Reset to original video');
}
});

// ---- Theme toggle ----
themeToggle.addEventListener('click', () => {
document.body.classList.toggle('light-theme');
themeToggle.textContent = document.body.classList.contains('light-theme') ? '☀️ Light' : '🌙 Dark';
});

// ---- Initial status ----
setStatus('✅ Upload a video to start editing.');

})();
</script>

<!-- ===== FFmpeg.wasm CDN (for actual video processing) ===== -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

</body>
