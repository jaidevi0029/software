    <style>
        :root {
            --bg: #0f0f1a;
            --surface: #1a1a2e;
            --surface2: #12121f;

            --text: #e0e0e0;

        .light-theme {
            --bg: #f0f2f5;

            --surface2: #e8eaed;
            --border: #d0d2d6;
            --text: #1a1a2e;

            margin: 0;

            font-family: 'Segoe UI', Tahoma, sans-serif;
            transition: background 0.3s, color 0.3s, border 0.3s;

        body {

        .container {

            padding: 25px;
            max-width: 1100px;
            width: 100%;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;

            padding-bottom: 12px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .theme-toggle {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background: var(--accent); color: #0f0f1a; }
        .btn-primary:hover:not(:disabled) { transform: scale(1.03); }
        .btn-danger { background: #ff3333; color: #fff; }
        .btn-danger:hover:not(:disabled) { transform: scale(1.03); }
        .btn-success { background: #00c853; color: #0f0f1a; }
        .btn-success:hover:not(:disabled) { transform: scale(1.03); }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover { border-color: var(--accent); }

        /* UPLOAD ZONE */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 30px 20px;
            text-align: center;
            color: var(--text2);
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 16px;

        .upload-zone:hover { border-color: var(--accent); background: var(--surface2); }

        /* VIDEO PLAYER */

        /* CONTROLS */
        .controls-row {
            display: flex;

        @media (max-width:600px) {
            .container { padding: 12px; }

        /* Chat UI */
        .chat-container {

            color: var(--text);
            align-self: flex-start;
        }
        .chat-input-row {
            display: flex;
            gap: 8px;
        }
        .chat-input-row input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
        }
        .chat-input-row button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #0f0f1a;
            font-weight: 600;
            cursor: pointer;
        }
        .chat-input-row button:hover { opacity: 0.9; }
    </style>

    <!-- Advanced Controls -->
    <div class="controls-row" style="margin-top:10px;">
        <label>Compress <select id="compressSelect">
            <option value="none">None</option>
            <option value="low">Low (Small Size)</option>
            <option value="medium" selected>Medium (Balanced)</option>
            <option value="high">High (Best Quality)</option>

        <label>Rotate <select id="rotateSelect">
            <option value="0">0°</option>

    <!-- MERGE LIST -->
    <div class="merge-list" id="mergeList" style="display:none;">
        <h4>📂 Videos to Merge</h4>
        <div id="mergeItems"></div>

    <!-- AI Tool Buttons -->
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;">
        <button class="btn btn-primary" id="translateBtn" disabled>🌍 Translate</button>
        <button class="btn btn-primary" id="summarizeBtn" disabled>📝 Summarize</button>
        <button class="btn btn-primary" id="audioBtn" disabled>🔊 Listen</button>
        <button class="btn btn-primary" id="chatToggleBtn" disabled>🤖 AI Chat</button>
        <button class="btn btn-success" id="downloadTxtBtn" disabled>⬇ .txt</button>
        <button class="btn btn-success" id="downloadDocxBtn" disabled>📄 .docx</button>

    <!-- AI Chat Container -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-messages" id="chatMessages">
            <div class="chat-message ai">🤖 Hello! Ask me anything about your video and notes.</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Ask about your video..." />
            <button id="chatSendBtn">Send</button>

    <!-- STATUS -->
    <div class="status-msg" id="statusMsg">✅ Upload a video to start editing.</div>

<script>
    // ============================================================
    // PROFESSIONAL VIDEO EDITOR – FULL JAVASCRIPT
    // ============================================================

    (function(){
        'use strict';

        // ---- DOM refs ----
        const video = document.getElementById('videoPreview');
        const fileInput = document.getElementById('fileInput');
        const uploadZone = document.getElementById('uploadZone');
        const trimStart = document.getElementById('trimStart');
        const trimEnd = document.getElementById('trimEnd');
        const speedSelect = document.getElementById('speedSelect');
        const volumeRange = document.getElementById('volumeRange');
        const muteCheck = document.getElementById('muteCheck');
        const mergeBtn = document.getElementById('mergeBtn');
        const mergeList = document.getElementById('mergeList');
        const mergeItems = document.getElementById('mergeItems');
        const resetBtn = document.getElementById('resetBtn');
        const exportBtn = document.getElementById('exportBtn');
        const exportGifBtn = document.getElementById('exportGifBtn');
        const statusMsg = document.getElementById('statusMsg');
        const themeToggle = document.getElementById('themeToggle');
        const addNoteBtn = document.getElementById('addNoteBtn');
        const translateBtn = document.getElementById('translateBtn');
        const summarizeBtn = document.getElementById('summarizeBtn');
        const audioBtn = document.getElementById('audioBtn');
        const chatToggleBtn = document.getElementById('chatToggleBtn');
        const chatContainer = document.getElementById('chatContainer');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const downloadTxtBtn = document.getElementById('downloadTxtBtn');
        const downloadDocxBtn = document.getElementById('downloadDocxBtn');
        const compressSelect = document.getElementById('compressSelect');
        const rotateSelect = document.getElementById('rotateSelect');
        const textOverlay = document.getElementById('textOverlay');
        const applyOverlayBtn = document.getElementById('applyOverlayBtn');

        // ---- State ----
        let uploadedFiles = [];
        let currentFileIndex = 0;
        let videoURL = null;
        let isMerged = false;
        let videoNotes = '';
        let isChatOpen = false;
        let videoDuration = 0;
        let videoWidth = 0;
        let videoHeight = 0;

        // ---- Helper: set status ----
        function setStatus(msg, isError=false) {
            statusMsg.textContent = msg;
            statusMsg.style.borderLeftColor = isError ? '#ff3333' : '#ffd200';
        }

        // ---- Load video ----
        function loadVideo(file) {
            if (!file) return;
            const url = URL.createObjectURL(file);
            video.src = url;
            videoURL = url;
            video.load();
            video.onloadedmetadata = () => {
                videoDuration = video.duration;
                videoWidth = video.videoWidth;
                videoHeight = video.videoHeight;
                setStatus(`✅ Loaded: ${file.name} (${(file.size/1024/1024).toFixed(1)} MB) - ${videoWidth}x${videoHeight}`);
                resetBtn.disabled = false;
                exportBtn.disabled = false;
                exportGifBtn.disabled = false;
                mergeBtn.disabled = false;
                // Update trim sliders
                trimStart.max = video.duration;
                trimEnd.max = video.duration;
                trimEnd.value = video.duration;
                trimStart.value = 0;
                // Enable AI buttons if note exists
                if (videoNotes.trim()) {
                    enableButtons();
                }
            };
        }

        // ---- Upload handlers ----
        uploadZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length > 0) {
                uploadedFiles = Array.from(files);
                currentFileIndex = 0;
                loadVideo(uploadedFiles[0]);
                if (uploadedFiles.length > 1) {
                    mergeList.style.display = 'block';
                    renderMergeList();
                }
            }
        });
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.style.borderColor = 'var(--accent)';
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.style.borderColor = 'var(--border)';
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.style.borderColor = 'var(--border)';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                uploadedFiles = Array.from(files);
                currentFileIndex = 0;
                loadVideo(uploadedFiles[0]);
                if (uploadedFiles.length > 1) {
                    mergeList.style.display = 'block';
                    renderMergeList();
                }
            }
        });

        // ---- Render merge list ----
        function renderMergeList() {
            mergeItems.innerHTML = '';
            uploadedFiles.forEach((file, idx) => {
                const div = document.createElement('div');
                div.className = 'merge-item';
                div.innerHTML = `
                    <span>${idx+1}. ${file.name}</span>
                    <button class="remove-merge" data-index="${idx}">✕</button>
                `;
                mergeItems.appendChild(div);
            });
            document.querySelectorAll('.remove-merge').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.index);
                    uploadedFiles.splice(idx, 1);
                    renderMergeList();
                    if (uploadedFiles.length === 0) mergeList.style.display = 'none';
                    if (uploadedFiles.length > 0 && currentFileIndex >= uploadedFiles.length) {
                        currentFileIndex = uploadedFiles.length - 1;
                        loadVideo(uploadedFiles[currentFileIndex]);
                    }
                });
            });
        }

        // ---- Add Text Overlay (simulated using FFmpeg) ----
        applyOverlayBtn.addEventListener('click', async () => {
            const text = textOverlay.value.trim();
            if (!text) {
                setStatus('⚠️ Please enter text to overlay.', true);
                return;
            }
            if (!videoURL) {
                setStatus('⚠️ Please upload a video first.', true);
                return;
            }
            setStatus('⏳ Adding text overlay...');

            try {
                // Get current video as blob
                const response = await fetch(video.src);
                const blob = await response.blob();
                const data = await new Uint8Array(await blob.arrayBuffer());

                // Use FFmpeg.wasm to add text overlay
                const { createFFmpeg, fetchFile } = FFmpeg;
                const ffmpeg = createFFmpeg({ log: false, corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js' });
                await ffmpeg.load();

                ffmpeg.FS('writeFile', 'input.mp4', data);

                // Draw text overlay using drawtext filter
                const filter = `drawtext=text='${text}':fontcolor=white:fontsize=24:box=1:boxcolor=black@0.5:boxborderw=5:x=(w-text_w)/2:y=(h-text_h)/2`;
                await ffmpeg.run('-i', 'input.mp4', '-vf', filter, '-c:a', 'copy', 'output.mp4');

                const output = ffmpeg.FS('readFile', 'output.mp4');
                const outBlob = new Blob([output.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(outBlob);

                // Update video player
                video.src = url;
                videoURL = url;
                setStatus(`✅ Text overlay added: "${text}"`);

                // Cleanup
                ffmpeg.FS('unlink', 'input.mp4');
                ffmpeg.FS('unlink', 'output.mp4');

            } catch (err) {
                setStatus('❌ Text overlay failed: ' + err.message, true);
                console.error(err);
            }
        });

        // ---- Compress Video ----
        async function compressVideo() {
            const level = compressSelect.value;
            if (level === 'none') {
                setStatus('✅ No compression applied.');
                return;
            }

            setStatus('⏳ Compressing video...');

            try {
                const response = await fetch(video.src);
                const blob = await response.blob();
                const data = await new Uint8Array(await blob.arrayBuffer());

                const { createFFmpeg, fetchFile } = FFmpeg;
                const ffmpeg = createFFmpeg({ log: false, corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js' });
                await ffmpeg.load();

                ffmpeg.FS('writeFile', 'input.mp4', data);

                // Set compression level
                let crf = '23'; // default
                if (level === 'low') crf = '35';
                else if (level === 'medium') crf = '28';
                else if (level === 'high') crf = '18';

                await ffmpeg.run('-i', 'input.mp4', '-c:v', 'libx264', '-crf', crf, '-c:a', 'copy', 'output.mp4');

                const output = ffmpeg.FS('readFile', 'output.mp4');
                const outBlob = new Blob([output.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(outBlob);

                // Update video player
                video.src = url;
                videoURL = url;
                setStatus(`✅ Video compressed (${level} level)`);

                // Cleanup
                ffmpeg.FS('unlink', 'input.mp4');
                ffmpeg.FS('unlink', 'output.mp4');

            } catch (err) {
                setStatus('❌ Compression failed: ' + err.message, true);
                console.error(err);
            }
        }

        compressSelect.addEventListener('change', compressVideo);

        // ---- Rotate Video ----
        async function rotateVideo() {
            const rotation = rotateSelect.value;
            if (rotation === '0') {
                setStatus('✅ No rotation applied.');
                return;
            }

            setStatus('⏳ Rotating video...');

            try {
                const response = await fetch(video.src);
                const blob = await response.blob();
                const data = await new Uint8Array(await blob.arrayBuffer());

                const { createFFmpeg, fetchFile } = FFmpeg;
                const ffmpeg = createFFmpeg({ log: false, corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js' });
                await ffmpeg.load();

                ffmpeg.FS('writeFile', 'input.mp4', data);

                let filter = '';
                if (rotation === '90') filter = 'transpose=1';
                else if (rotation === '-90') filter = 'transpose=2';
                else if (rotation === '180') filter = 'transpose=1,transpose=1';
                else if (rotation === 'hflip') filter = 'hflip';
                else if (rotation === 'vflip') filter = 'vflip';

                await ffmpeg.run('-i', 'input.mp4', '-vf', filter, '-c:a', 'copy', 'output.mp4');

                const output = ffmpeg.FS('readFile', 'output.mp4');
                const outBlob = new Blob([output.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(outBlob);

                // Update video player
                video.src = url;
                videoURL = url;
                setStatus(`✅ Video rotated (${rotation})`);

                // Cleanup
                ffmpeg.FS('unlink', 'input.mp4');
                ffmpeg.FS('unlink', 'output.mp4');

            } catch (err) {
                setStatus('❌ Rotation failed: ' + err.message, true);
                console.error(err);
            }
        }

        rotateSelect.addEventListener('change', rotateVideo);

        // ---- Merge videos ----
        mergeBtn.addEventListener('click', async () => {
            if (uploadedFiles.length < 2) {
                setStatus('⚠️ Upload at least 2 videos to merge.', true);
                return;
            }
            setStatus('⏳ Merging videos... (this may take a minute)');

            try {
                const { createFFmpeg, fetchFile } = FFmpeg;
                const ffmpeg = createFFmpeg({ log: false });
                await ffmpeg.load();

                for (let i = 0; i < uploadedFiles.length; i++) {
                    const data = await fetchFile(uploadedFiles[i]);
                    ffmpeg.FS('writeFile', `input${i}.mp4`, data);
                }

                const list = uploadedFiles.map((_, i) => `file 'input${i}.mp4'`).join('\n');
                ffmpeg.FS('writeFile', 'list.txt', list);

                await ffmpeg.run('-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', 'output.mp4');

                const data = ffmpeg.FS('readFile', 'output.mp4');
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);

                video.src = url;
                videoURL = url;
                isMerged = true;
                setStatus(`✅ Merged ${uploadedFiles.length} videos successfully!`);
                exportBtn.disabled = false;
                exportGifBtn.disabled = false;

                ffmpeg.FS('unlink', 'output.mp4');
                uploadedFiles.forEach((_, i) => ffmpeg.FS('unlink', `input${i}.mp4`));
                ffmpeg.FS('unlink', 'list.txt');
            } catch (err) {
                setStatus('❌ Merge failed: ' + err.message, true);
                console.error(err);
            }
        });

        // ---- Export GIF ----
        exportGifBtn.addEventListener('click', async () => {
            setStatus('⏳ Exporting GIF... (this may take a moment)');
            try {
                const response = await fetch(video.src);
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `video-${Date.now()}.gif`;
                a.click();
                setStatus('✅ GIF download started! (Note: Actual GIF conversion requires server-side processing)');
            } catch (err) {
                setStatus('❌ GIF export failed: ' + err.message, true);
            }
        });

        // ---- Add Note ----
        addNoteBtn.addEventListener('click', () => {
            const note = prompt('Enter a note about this video:');
            if (note && note.trim()) {
                videoNotes += note.trim() + '\n';
                setStatus('📝 Note added!');
                enableButtons();
            }
        });

        // ---- Enable AI buttons ----
        function enableButtons() {
            translateBtn.disabled = false;
            summarizeBtn.disabled = false;
            audioBtn.disabled = false;
            chatToggleBtn.disabled = false;
            downloadTxtBtn.disabled = false;
            downloadDocxBtn.disabled = false;
        }

        // ---- Translate ----
        translateBtn.addEventListener('click', async () => {
            if (!videoNotes.trim()) {
                setStatus('⚠️ No notes to translate. Add a note first.', true);
                return;
            }
            setStatus('⏳ Translating notes...');
            try {
                const response = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=hi&dt=t&q=' + encodeURIComponent(videoNotes));
                const data = await response.json();
                if (data && data[0] && data[0][0]) {
                    const translated = data[0].map(item => item[0]).join('');
                    setStatus(`🌍 Translated to Hindi: ${translated.substring(0, 100)}...`);
                } else {
                    setStatus('⚠️ Translation failed.', true);
                }
            } catch(err) {
                setStatus('⚠️ Translation error: ' + err.message, true);
            }
        });

        // ---- Summarize ----
        summarizeBtn.addEventListener('click', () => {
            if (!videoNotes.trim()) {
                setStatus('⚠️ No notes to summarize. Add a note first.', true);
                return;
            }
            const sentences = videoNotes.split(/[.!?]+/).filter(s => s.trim().length > 0);
            let summary;
            if (sentences.length <= 3) {
                summary = videoNotes.substring(0, 200) + (videoNotes.length > 200 ? '...' : '');
            } else {
                summary = sentences.slice(0, 3).join('. ') + '.';
                if (summary.length > 300) summary = summary.substring(0, 300) + '...';
            }
            setStatus(`📝 Summary: ${summary}`);
        });

        // ---- Text-to-Speech ----
        audioBtn.addEventListener('click', () => {
            if (!videoNotes.trim()) {
                setStatus('⚠️ No notes to listen to. Add a note first.', true);
                return;
            }
            const utterance = new SpeechSynthesisUtterance(videoNotes.substring(0, 1000));
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
            setStatus('🔊 Speaking notes...');
        });

        // ---- AI Chat ----
        async function askAI(question) {
            if (!videoNotes.trim()) {
                setStatus('⚠️ No notes to chat about. Add a note first.', true);
                return;
            }
            addChatMessage('user', question);
            setStatus('🤖 AI is thinking...');

            try {
                const context = `You are a helpful AI assistant. The user has these video notes: ${videoNotes}. Answer based on these notes. User question: ${question}`;
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyC8I4Q5qyGmZm2ZgB3l5G9kFwXZ2HkFcLw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: context }] }]
                    })
                });
                if (!response.ok) throw new Error('API request failed');
                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry, I could not generate a response.';
                addChatMessage('ai', reply);
                setStatus('✅ AI response ready!');
            } catch (err) {
                console.error(err);
                addChatMessage('ai', '⚠️ Error: ' + err.message);
                setStatus('⚠️ AI error: ' + err.message, true);
            }
        }

        function addChatMessage(role, text) {
            const div = document.createElement('div');
            div.className = `chat-message ${role}`;
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ---- Chat Toggle ----
        chatToggleBtn.addEventListener('click', () => {
            isChatOpen = !isChatOpen;
            chatContainer.classList.toggle('visible', isChatOpen);
            if (isChatOpen && chatMessages.children.length === 1) {
                addChatMessage('ai', '🤖 Hello! Ask me anything about your video and notes.');
            }
            setStatus(isChatOpen ? '💬 Chat open. Ask anything!' : '💬 Chat closed.');
        });

        // ---- Chat Send ----
        chatSendBtn.addEventListener('click', () => {
            const question = chatInput.value.trim();
            if (!question) { setStatus('⚠️ Enter a question.', true); return; }
            chatInput.value = '';
            askAI(question);
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') chatSendBtn.click();
        });

        // ---- Download .txt ----
        downloadTxtBtn.addEventListener('click', () => {
            const text = videoNotes || 'No notes added.';
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `video-notes-${Date.now()}.txt`;
            a.click();
            setStatus('✅ .txt file downloaded!');
        });

        // ---- Download .docx ----
        downloadDocxBtn.addEventListener('click', () => {
            const text = videoNotes || 'No notes added.';
            const htmlContent = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" 
                      xmlns:w="urn:schemas-microsoft-com:office:word" 
                      xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="UTF-8" /><title>Video Notes</title>
                <style>body { font-family: Arial; font-size: 12pt; line-height: 1.5; }</style></head>
                <body>${text.replace(/\n/g, '<br />')}</body></html>
            `;
            const blob = new Blob([htmlContent], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `video-notes-${Date.now()}.docx`;
            a.click();
            setStatus('✅ .docx file downloaded!');
        });

        // ---- Trim, Speed, Volume, Mute ----
        function applyTrim() {
            const start = parseFloat(trimStart.value);
            const end = parseFloat(trimEnd.value);
            if (start >= end) {
                setStatus('⚠️ Start must be less than End', true);
                return;
            }
            video.currentTime = start;
            video.play();
            setTimeout(() => {
                video.pause();
                setStatus(`✅ Trim set: ${start.toFixed(1)}s to ${end.toFixed(1)}s`);
            }, 500);
        }

        trimStart.addEventListener('input', applyTrim);
        trimEnd.addEventListener('input', applyTrim);

        speedSelect.addEventListener('change', () => {
            video.playbackRate = parseFloat(speedSelect.value);
            setStatus(`⏩ Speed: ${speedSelect.value}x`);
        });

        volumeRange.addEventListener('input', () => {
            video.volume = parseFloat(volumeRange.value) / 100;
        });

        muteCheck.addEventListener('change', () => {
            video.muted = muteCheck.checked;
            setStatus(muteCheck.checked ? '🔇 Muted' : '🔊 Unmuted');
        });

        // ---- Export ----
        exportBtn.addEventListener('click', async () => {
            setStatus('⏳ Exporting video... (this may take a minute)');

            try {
                const { createFFmpeg, fetchFile } = FFmpeg;
                const ffmpeg = createFFmpeg({ log: false, corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js' });
                await ffmpeg.load();

                const response = await fetch(video.src);
                const blob = await response.blob();
                const data = await fetchFile(blob);
                ffmpeg.FS('writeFile', 'input.mp4', data);

                const start = parseFloat(trimStart.value);
                const end = parseFloat(trimEnd.value);
                const speed = parseFloat(speedSelect.value);
                const volume = parseFloat(volumeRange.value) / 100;
                const mute = muteCheck.checked ? 'volume=0' : `volume=${volume}`;

                let args = ['-i', 'input.mp4'];
                if (start > 0 || end < video.duration) {
                    args.push('-ss', start.toString(), '-to', end.toString());
                }
                if (speed !== 1) {
                    args.push('-filter:v', `setpts=${1/speed}*PTS`, '-filter:a', `atempo=${speed}`);
                }
                args.push('-af', mute);
                args.push('-c', 'copy', 'output.mp4');

                await ffmpeg.run(...args);

                const output = ffmpeg.FS('readFile', 'output.mp4');
                const outBlob = new Blob([output.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(outBlob);

                const a = document.createElement('a');
                a.href = url;
                a.download = `edited-video-${Date.now()}.mp4`;
                a.click();

                setStatus('✅ Export complete! Download started.');

                ffmpeg.FS('unlink', 'input.mp4');
                ffmpeg.FS('unlink', 'output.mp4');
            } catch (err) {
                setStatus('❌ Export failed: ' + err.message, true);
                console.error(err);
            }
        });

        // ---- Reset ----
        resetBtn.addEventListener('click', () => {
            if (uploadedFiles.length > 0) {
                loadVideo(uploadedFiles[0]);
                trimStart.value = 0;
                trimEnd.value = video.duration || 100;
                speedSelect.value = '1';
                volumeRange.value = 100;
                muteCheck.checked = false;
                video.volume = 1;
                video.muted = false;
                video.playbackRate = 1;
                compressSelect.value = 'none';
                rotateSelect.value = '0';
                textOverlay.value = '';
                setStatus('↺ Reset to original video');
            }
        });

        // ---- Theme toggle ----
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            themeToggle.textContent = document.body.classList.contains('light-theme') ? '☀️ Light' : '🌙 Dark';
        });

        // ---- Initial status ----
        setStatus('✅ Upload a video to start editing.');

    })();
</script>
