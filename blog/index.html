    <style>

        /* Header Styles */
        .blog-header {

        .blog-header h1 {

        .blog-header p {

        /* Search Bar */
        .search-section {
            margin-bottom: 40px;

        .search-box input:focus {

        .search-box button {
            padding: 14px 25px;

        .filter-btn {

            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        
        /* Post List - Grid Style */
        .post-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .post-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        
        .post-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.02);
            border-color: #2563eb;
        }
        
        .post-category {
            display: inline-block;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .post-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .post-title a {
            text-decoration: none;
            color: #1e293b;
            transition: color 0.3s;
        }
        
        .post-title a:hover {
            color: #2563eb;
        }
        
        .post-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #64748b;
        }
        
        .post-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .post-excerpt {
            color: #475569;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: gap 0.3s;
        }
        
        .read-more:hover {
            gap: 12px;
        }
        
        /* Back Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 40px;
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            background: #2563eb;
            transform: translateX(-3px);
        }
        
        /* Footer */
        .blog-footer {
            background: #1e293b;
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
        }
        
        .blog-footer p {
            color: #94a3b8;
            font-size: 14px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .blog-header h1 { font-size: 32px; }
            .post-title { font-size: 18px; }
            .post-card { padding: 18px; }
            .category-filter { gap: 8px; }
            .filter-btn { padding: 6px 14px; font-size: 12px; }
        }
        
        /* No Results */
        .no-results {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 20px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="blog-header">
    <h1>📝 Software Tool Guide Blog</h1>
    <p>Expert reviews, in-depth guides, and latest trends in AI, marketing, and software tools</p>
    <div class="blog-stats">
        <div class="stat">
            <div class="stat-number" id="postCount">0</div>
            <div class="stat-label">Articles</div>
        </div>
        <div class="stat">
            <div class="stat-number">2026</div>
            <div class="stat-label">Updated Daily</div>
        </div>
    </div>
</div>

<div class="container">
    <div class="search-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search articles..." onkeyup="filterPosts()">
            <button onclick="filterPosts()">🔍 Search</button>
        </div>
    </div>
    
    <div class="category-filter">
        <button class="filter-btn active" data-cat="all" onclick="filterCategory('all')">All</button>
        <button class="filter-btn" data-cat="ai" onclick="filterCategory('ai')">🤖 AI Tools</button>
        <button class="filter-btn" data-cat="marketing" onclick="filterCategory('marketing')">📈 Marketing</button>
        <button class="filter-btn" data-cat="seo" onclick="filterCategory('seo')">🔍 SEO</button>
        <button class="filter-btn" data-cat="youtube" onclick="filterCategory('youtube')">📺 YouTube</button>
        <button class="filter-btn" data-cat="affiliate" onclick="filterCategory('affiliate')">💰 Affiliate</button>
    </div>
    
    <div class="post-grid" id="postGrid"></div>
    
    <a href="/" class="back-link">← Back to Home</a>
</div>

<div class="blog-footer">
    <p>© 2026 Software Tool Guide · Honest reviews, expert comparisons, and best deals</p>
    <p style="margin-top: 8px; font-size: 12px;">📧 Contact: jaidevi0029@gmail.com</p>
</div>

<script>
    // Blog posts data with categories
    const posts = [
        { title: "Affiliate Marketing Beginners Guide 2026", file: "affiliate-marketing-beginners-guide-2026.html", category: "affiliate", excerpt: "Complete guide to start affiliate marketing from scratch. Learn strategies, tools, and tips to earn passive income.", date: "May 10, 2026" },
        { title: "AI Tools Beginners Guide 2026", file: "ai-tools-beginners-guide-2026.html", category: "ai", excerpt: "Best AI tools for beginners. Learn how to use ChatGPT, Midjourney, and other AI tools effectively.", date: "May 9, 2026" },
        { title: "Best AI Tools for YouTube Growth 2026", file: "best-ai-tools-for-youtube-growth-2026.html", category: "youtube", excerpt: "Top AI tools that help grow your YouTube channel faster. Optimize videos, titles, and thumbnails.", date: "May 8, 2026" },
        { title: "ChatGPT vs Bard vs Claude 2026", file: "chatgpt-vs-bard-vs-claude-2026.html", category: "ai", excerpt: "Detailed comparison of top AI chatbots. Which one is best for content creation, coding, and research?", date: "May 7, 2026" },
        { title: "Content Marketing Strategy Guide 2026", file: "content-marketing-strategy-guide-2026.html", category: "marketing", excerpt: "Proven content marketing strategies that drive traffic, leads, and sales in 2026.", date: "May 6, 2026" },
        { title: "Ecommerce SEO Guide 2026", file: "ecommerce-seo-guide-2026.html", category: "seo", excerpt: "Boost your online store rankings with these ecommerce SEO techniques.", date: "May 5, 2026" },
        { title: "Email Marketing Automation Guide 2026", file: "email-marketing-automation-guide-2026.html", category: "marketing", excerpt: "Automate your email campaigns for higher conversions and better engagement.", date: "May 4, 2026" },
        { title: "How to Make Money with AI Tools 2026", file: "how-to-make-money-with-ai-tools-2026.html", category: "ai", excerpt: "Real ways to earn money using AI tools. Side hustles, freelancing, and business ideas.", date: "May 3, 2026" },
        { title: "LinkedIn Marketing Guide 2026", file: "linkedin-marketing-guide-2026.html", category: "marketing", excerpt: "Grow your brand and generate leads using LinkedIn marketing strategies.", date: "May 2, 2026" },
        { title: "Local SEO Guide 2026 for Small Business", file: "local-seo-guide-2026-small-business.html", category: "seo", excerpt: "Rank higher in local search results. Google Maps optimization and local citations guide.", date: "May 1, 2026" },
        { title: "Plagiarism Checker Complete Guide 2026", file: "plagiarism-checker-complete-guide-2026.html", category: "ai", excerpt: "Best plagiarism checkers for students, writers, and content creators.", date: "Apr 30, 2026" },
        { title: "Podcasting Beginners Guide 2026", file: "podcasting-beginners-guide-2026.html", category: "marketing", excerpt: "Start your own podcast from scratch. Equipment, hosting, and promotion tips.", date: "Apr 29, 2026" },
        { title: "SEO Trends 2026 Complete Guide", file: "seo-trends-2026-complete-guide.html", category: "seo", excerpt: "Latest SEO trends and algorithm updates for 2026. Stay ahead of competition.", date: "Apr 28, 2026" },
        { title: "Social Media Marketing Tools 2026", file: "social-media-marketing-tools-2026.html", category: "marketing", excerpt: "Best social media management tools to save time and grow followers.", date: "Apr 27, 2026" },
        { title: "WordPress SEO Complete Guide 2026", file: "wordpress-seo-complete-guide-2026.html", category: "seo", excerpt: "Optimize your WordPress website for higher search rankings.", date: "Apr 26, 2026" },
        { title: "YouTube SEO Guide 2026", file: "youtube-seo-guide-2026.html", category: "youtube", excerpt: "Rank your YouTube videos higher. Keyword research, tags, and thumbnail optimization.", date: "Apr 25, 2026" }
    ];
    
    // Update post count
    document.getElementById('postCount').innerText = posts.length;
    
    let currentCategory = 'all';
    let currentSearch = '';
    
    function renderPosts() {
        const filtered = posts.filter(post => {
            const matchesCategory = currentCategory === 'all' || post.category === currentCategory;
            const matchesSearch = currentSearch === '' || post.title.toLowerCase().includes(currentSearch) || post.excerpt.toLowerCase().includes(currentSearch);
            return matchesCategory && matchesSearch;
        });
        
        const grid = document.getElementById('postGrid');
        
        if (filtered.length === 0) {
            grid.innerHTML = '<div class="no-results"><h3>😢 No posts found</h3><p>Try different search terms or category</p></div>';
            return;
        }
        
        let html = '<div class="post-grid">';
        filtered.forEach(post => {
            const categoryIcon = getCategoryIcon(post.category);
            html += `
                <div class="post-card">
                    <span class="post-category">${categoryIcon} ${getCategoryName(post.category)}</span>
                    <h2 class="post-title"><a href="${post.file}">${post.title}</a></h2>
                    <div class="post-meta">
                        <span>📅 ${post.date}</span>
                        <span>⏱️ 5 min read</span>
                    </div>
                    <p class="post-excerpt">${post.excerpt}</p>
                    <a href="${post.file}" class="read-more">Read Full Article →</a>
                </div>
            `;
        });
        html += '</div>';
        grid.innerHTML = html;
    }
    
    function getCategoryIcon(cat) {
        const icons = {
            ai: '🤖', marketing: '📈', seo: '🔍', youtube: '📺', affiliate: '💰'
        };
        return icons[cat] || '📄';
    }
    
    function getCategoryName(cat) {
        const names = {
            ai: 'AI Tools', marketing: 'Marketing', seo: 'SEO', youtube: 'YouTube', affiliate: 'Affiliate'
        };
        return names[cat] || 'Guide';
    }
    
    function filterCategory(category) {
        currentCategory = category;
        // Update active button style
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.dataset.cat === category) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        renderPosts();
    }
    
    function filterPosts() {
        currentSearch = document.getElementById('searchInput').value.toLowerCase().trim();
        renderPosts();
    }
    
    // Initial render
    renderPosts();
</script>
</body>
</html>
